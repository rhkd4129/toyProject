services:
  frontend:
    container_name: frontend
    image: rhkd4129/frontend:latest
    ports:
      - "80:80"
    restart: always

  backend:
    container_name: backend
    image: rhkd4129/backend:latest
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      oracle-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/xe
      SPRING_DATASOURCE_USERNAME: MYPROJECT
      SPRING_DATASOURCE_PASSWORD: tiger2
      SPRING_REDIS_HOST: redis-db
      SPRING_REDIS_PORT: 6379
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
      CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${CLOUD_AWS_CREDENTIALS_SECRET_KEY}


  api-server:
    ports:
      - "8084:8084"
    container_name: api-server
    image: rhkd4129/api-server:latest
    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    environment:
      REDIS_HOST: redis-db

  oracle-db:
    container_name: oracle-db
    image: gvenzl/oracle-xe:11
    ports:
      - "1521:1521"
    restart: always
    environment:
      ORACLE_PASSWORD: oracle
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/oracle@localhost:1521/xe"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis-db:
    container_name: redis-db
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  oracle_data:
