name: deploy-apiserver.yml
on:
  push:
    branches:
      - main
    paths:
      - 'apiserver/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 이미지 빌드 & 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-server:latest ./apiserver
          docker push ${{ secrets.DOCKER_USERNAME }}/api-server:latest

      - name: EC2에서 pull & 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          #          host: 43.200.234.146
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker compose pull
            docker compose up -d
